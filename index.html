<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151f" />
    <title>Eats Delivery — Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="site-title"><img src="assets/eats-delivery-header-logo-blue-route.png" alt="Eats Delivery" /><svg class="route-roots" viewBox="0 0 520 156" aria-hidden="true"><defs><linearGradient id="rootGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#46d897" stop-opacity="0"/><stop offset=".42" stop-color="#5bedad" stop-opacity=".9"/><stop offset="1" stop-color="#5bedad"/></linearGradient><linearGradient id="rootBlue" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#54c8ff" stop-opacity="0"/><stop offset=".42" stop-color="#54c8ff" stop-opacity=".9"/><stop offset="1" stop-color="#54c8ff"/></linearGradient><linearGradient id="rootYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd85a"/><stop offset="1" stop-color="#ffd85a" stop-opacity="0"/></linearGradient><filter id="rootGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="M250 0 C236 27 207 41 171 53 C123 69 77 74 18 69 C39 87 69 94 104 99" fill="none" stroke="url(#rootGreen)" stroke-width="3.5" stroke-linecap="round" filter="url(#rootGlow)"/><path d="M270 0 C284 27 313 41 349 53 C397 69 443 74 502 69 C481 87 451 94 416 99" fill="none" stroke="url(#rootBlue)" stroke-width="3.5" stroke-linecap="round" filter="url(#rootGlow)"/><path d="M260 0 C261 28 260 51 257 73 C255 88 246 96 232 104" fill="none" stroke="url(#rootYellow)" stroke-width="2.6" stroke-linecap="round" filter="url(#rootGlow)"/></svg><span class="onboarding-title"><span class="title-onboarding">ONBOARDING</span><span class="title-pentru">PENTRU</span><span class="title-curieri">CURIERI</span></span></header>
      <nav class="stepper" aria-label="Pașii onboarding-ului">
        <div class="step intro-step" data-step="1"><span class="step-icon intro-icon"><img src="assets/intro-icon.png" alt="Introducere" /></span><span class="step-label">Introducere</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="2"><span class="step-icon bolt-icon"><img src="assets/bolt-food-logo-clean.png" alt="Bolt Food" /></span><span class="step-label">Bolt Food</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="3"><span class="step-icon calendar-payment-icon"><img src="assets/payment-calendar-icon-v3.png" alt="Calendar de Plată" /></span><span class="step-label">Calendar de Plată</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="4"><span class="step-icon registration-icon"><img src="assets/registration-icon.png" alt="" /></span><span class="step-label">Înregistrare</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="5"><span class="step-icon telegram-icon"><img src="assets/telegram-logo.svg" alt="Telegram" /></span><span class="step-label">Telegram</span></div>
      </nav>
      <section id="app" class="card" aria-live="polite"></section>
      <footer>© Eats Delivery - 2026 | All rights reserved</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
