<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151f" />
    <title>Eats Delivery — Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="site-title"><img class="header-art" src="assets/onboarding-header-art.png" alt="Eats Delivery — Onboarding pentru Curieri" /></header>
      <nav class="stepper" aria-label="Pașii onboarding-ului">
        <div class="step intro-step" data-step="1"><span class="step-icon intro-icon"><img src="assets/intro-icon.png" alt="Introducere" /></span><span class="step-label">Introducere</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="2"><span class="step-icon bolt-icon"><img src="assets/bolt-food-logo-clean.png" alt="Bolt Food" /></span><span class="step-label">Bolt Food</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="3"><span class="step-icon calendar-payment-icon"><img src="assets/payment-calendar-icon-v3.png" alt="Calendar de Plată" /></span><span class="step-label">Calendar de Plată</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="4"><span class="step-icon registration-icon"><img src="assets/registration-icon.png" alt="" /></span><span class="step-label">Înregistrare</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="5"><span class="step-icon telegram-icon"><img src="assets/telegram-logo.svg" alt="Telegram" /></span><span class="step-label">Telegram</span></div>
      </nav>
      <section id="app" class="card" aria-live="polite"></section>
      <footer>© Eats Delivery - 2026 | All rights reserved</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
