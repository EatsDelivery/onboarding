<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151f" />
    <title>Eats Delivery — Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand"><span class="brand-mark">e</span><span>Eats Delivery</span></header>
      <nav class="stepper" aria-label="Pașii onboarding-ului">
        <div class="step" data-step="1"><span class="step-icon">👋</span><span class="step-label">Bun venit</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="2"><span class="step-icon">🛵</span><span class="step-label">Bolt Food</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="3"><span class="step-icon">▣</span><span class="step-label">Calendar de Plată</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="4"><span class="step-icon">♙</span><span class="step-label">Înregistrare</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="5"><span class="step-icon">➤</span><span class="step-label">Telegram</span></div>
      </nav>
      <section id="app" class="card" aria-live="polite"></section>
      <footer>Onboarding Eats Delivery</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
