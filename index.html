<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151f" />
    <title>Eats Delivery — Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="site-title"><img src="assets/eats-delivery-header-logo-blue-route.png" alt="Eats Delivery" /><svg class="route-roots" viewBox="0 0 520 220" aria-hidden="true"><defs><filter id="rootGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g fill="none" stroke-linecap="round" filter="url(#rootGlow)"><path d="M218 0 C208 31 180 54 144 72" stroke="#56e6a5" stroke-width="4"/><path d="M144 72 C102 90 52 96 8 86" stroke="#56e6a5" stroke-width="2.5" opacity=".78"/><path d="M8 86 C27 112 65 123 99 127 C124 131 138 142 145 156" stroke="#56e6a5" stroke-width="1.2" opacity=".56"/><path d="M99 127 C84 142 70 152 55 158" stroke="#56e6a5" stroke-width="1" opacity=".38"/><path d="M302 0 C312 31 340 54 376 72" stroke="#5acbff" stroke-width="4"/><path d="M376 72 C418 90 468 96 512 86" stroke="#5acbff" stroke-width="2.5" opacity=".78"/><path d="M512 86 C493 112 455 123 421 127 C396 131 382 142 375 156" stroke="#5acbff" stroke-width="1.2" opacity=".56"/><path d="M421 127 C436 142 450 152 465 158" stroke="#5acbff" stroke-width="1" opacity=".38"/><path d="M260 0 C260 36 258 64 254 87" stroke="#ffd95e" stroke-width="3.2"/><path d="M254 87 C250 103 241 115 225 128 C216 135 211 143 210 154" stroke="#ffd95e" stroke-width="1.35" opacity=".6"/></g></svg><span class="onboarding-title"><span class="title-onboarding">ONBOARDING</span><span class="title-pentru">PENTRU</span><span class="title-curieri">CURIERI</span></span></header>
      <nav class="stepper" aria-label="Pașii onboarding-ului">
        <div class="step intro-step" data-step="1"><span class="step-icon intro-icon"><img src="assets/intro-icon.png" alt="Introducere" /></span><span class="step-label">Introducere</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="2"><span class="step-icon bolt-icon"><img src="assets/bolt-food-logo-clean.png" alt="Bolt Food" /></span><span class="step-label">Bolt Food</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="3"><span class="step-icon calendar-payment-icon"><img src="assets/payment-calendar-icon-v3.png" alt="Calendar de Plată" /></span><span class="step-label">Calendar de Plată</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="4"><span class="step-icon registration-icon"><img src="assets/registration-icon.png" alt="" /></span><span class="step-label">Înregistrare</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="5"><span class="step-icon telegram-icon"><img src="assets/telegram-logo.svg" alt="Telegram" /></span><span class="step-label">Telegram</span></div>
      </nav>
      <section id="app" class="card" aria-live="polite"></section>
      <footer>© Eats Delivery - 2026 | All rights reserved</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
