<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151f" />
    <title>Eats Delivery — Onboarding</title>
    <meta name="description" content="Onboarding pentru curierii flotei Eats Delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eatsdelivery.github.io/onboarding/" />
    <meta property="og:title" content="Eats Delivery — Onboarding pentru Curieri" />
    <meta property="og:description" content="Parcurge pașii de onboarding pentru flota Eats Delivery." />
    <meta property="og:image" content="https://eatsdelivery.github.io/onboarding/assets/social-preview-whatsapp.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eats Delivery — Onboarding pentru Curieri" />
    <meta name="twitter:description" content="Parcurge pașii de onboarding pentru flota Eats Delivery." />
    <meta name="twitter:image" content="https://eatsdelivery.github.io/onboarding/assets/social-preview-transparent.png" />
    <link rel="image_src" href="https://eatsdelivery.github.io/onboarding/assets/social-preview-transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="site-title"><img class="header-art" src="assets/onboarding-header-art-final.png" alt="Eats Delivery — Onboarding pentru Curieri" /></header>
      <nav class="stepper" aria-label="Pașii onboarding-ului">
        <div class="step intro-step" data-step="1"><span class="step-icon intro-icon"><img src="assets/intro-icon.png" alt="Introducere" /></span><span class="step-label">Introducere</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="2"><span class="step-icon bolt-icon"><img src="assets/bolt-food-logo-clean.png" alt="Bolt Food" /></span><span class="step-label">Bolt Food</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="3"><span class="step-icon equipment-icon"><img src="assets/equipment-icon.png" alt="Echipament" /></span><span class="step-label">Echipament</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="4"><span class="step-icon calendar-payment-icon"><img src="assets/payment-calendar-icon-v3.png" alt="Calendar de Plată" /></span><span class="step-label">Calendar de Plată</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="5"><span class="step-icon registration-icon"><img src="assets/registration-icon.png" alt="" /></span><span class="step-label">Înregistrare</span></div>
        <span class="step-connector" aria-hidden="true"></span>
        <div class="step" data-step="6"><span class="step-icon telegram-icon"><img src="assets/community-icon.png" alt="Comunitate" /></span><span class="step-label">Comunitate</span></div>
      </nav>
      <section id="app" class="card" aria-live="polite"></section>
      <footer>© Eats Delivery - 2026 | All rights reserved</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
